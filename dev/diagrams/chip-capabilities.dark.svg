<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1034" viewBox="0 0 1200 1034" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the AS5047U does</title>
<desc id="chip-capabilities-desc">Capability map of the AS5047U: Absolute angle (supported): Measures the magnet's angle over a full turn in 14 bits, with or without the dynamic compensation; Rotation speed (supported): Measures the angular velocity in 14 bits, 24.141 °/s per count, up to 28000 rpm either way; DAEC and adaptive filter (supported): Corrects the angle for the measurement delay at speed, and filters transition noise at low speed; Zero position and direction (supported): Sets which angle reads 0 and which way the count rises, seen from above the chip; ABI incremental interface (supported): Quadrature A and B with an index pulse, 25 to 4096 pulses per revolution; UVW commutation and PWM (supported): Emulates the Hall switches of a BLDC motor for 1 to 7 pole pairs, or puts the angle out as PWM; Magnet and fault diagnostics (supported): Reports the gain control, the field magnitude and the error flags; each flag becomes a driver error; SPI frames with CRC (supported): 16-bit frames for the fastest reads, or 24- and 32-bit frames with a CRC-8 and a daisy-chain pad byte; OTP programming (guarded): Burns the zero and the settings into the chip once, with the datasheet's step-by-step procedure.</desc>
