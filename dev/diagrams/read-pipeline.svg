<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1093" viewBox="0 0 1200 1093" role="img" aria-labelledby="read-pipeline-title read-pipeline-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="read-pipeline-title">Every access is two frames</title>
<desc id="read-pipeline-desc">Timing of SPI frames: a read sends the command and then a NOP read (0x4000), because the chip answers each frame during the next one; a write sends a command frame and a data frame, then reads the register back.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1092" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">ARCHITECTURE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Every access is two frames</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One column per SPI frame. The chip answers each frame during the next one.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
