<path d="M358 710.8 L364.5 710.8 Q371 710.8 371 717.3 L371 818.7 Q371 825.2 377.5 825.2 L384 825.2" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-rail)"/>
<path d="M622 710.8 L628.5 710.8 Q635 710.8 635 717.3 L635 818.7 Q635 825.2 641.5 825.2 L648 825.2" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-rail)"/>
<path d="M886 710.8 L892.5 710.8 Q899 710.8 899 717.3 L899 818.7 Q899 825.2 905.5 825.2 L912 825.2" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-rail)"/>
