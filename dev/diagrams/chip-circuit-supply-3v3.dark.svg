<svg xmlns="http://www.w3.org/2000/svg" width="760" height="666" viewBox="0 0 760 666" role="img" aria-labelledby="chip-circuit-supply-3v3-title chip-circuit-supply-3v3-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-supply-3v3-title">AS5047U: 3.3 V operation</title>
<desc id="chip-circuit-supply-3v3-desc">Schematic of the AS5047U 3.3 v operation: the chip with U2 MCU, C1 capacitor 100 nF; the MCU wires carry the port hooks Transfer().</desc>
<rect x="0.5" y="0.5" width="759" height="665" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">AS5047U: 3.3 V operation</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Figure 11, right: VDD and VDD3V3 tied to a 3.0 V to 3.6 V supply with 100 nF to GND, so the</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">logic levels match a 3.3 V MCU. Above each MCU wire: the port hook that drives it.</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">Datasheet: Power Management, Figure 11, p. 11.</text>
