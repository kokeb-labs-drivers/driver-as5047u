<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="779" viewBox="0 0 1200 779" role="img" aria-labelledby="spi-frames-title spi-frames-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="spi-frames-title">SPI frames, bit by bit</title>
<desc id="spi-frames-desc">Bit layouts of the 16-, 24- and 32-bit SPI frames: on MOSI the R/W bit and a 14-bit address, on MISO a warning bit, an error bit and 14 data bits; 24-bit frames add a CRC-8 byte, and 32-bit frames add a pad byte, first on MOSI and last on MISO.</desc>
<rect x="0.5" y="0.5" width="1199" height="778" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">SPI frames, bit by bit</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Bits in the order they are clocked, most significant first. Numbers are bit positions in the frame.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
<rect x="128" y="184.8" width="32" height="34" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="160" y="184.8" width="32" height="34" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.2"/>
<rect x="192" y="184.8" width="448" height="34" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.2"/>
<rect x="128" y="244.8" width="32" height="34" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.2"/>
<rect x="160" y="244.8" width="32" height="34" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.2"/>
<rect x="192" y="244.8" width="448" height="34" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.2"/>
<rect x="128" y="351.8" width="32" height="34" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="160" y="351.8" width="32" height="34" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.2"/>
<rect x="192" y="351.8" width="448" height="34" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.2"/>
<rect x="640" y="351.8" width="256" height="34" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.2"/>
<rect x="128" y="411.8" width="32" height="34" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.2"/>
<rect x="160" y="411.8" width="32" height="34" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.2"/>
<rect x="192" y="411.8" width="448" height="34" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.2"/>
<rect x="640" y="411.8" width="256" height="34" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.2"/>
<rect x="128" y="518.8" width="256" height="34" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.2"/>
<rect x="384" y="518.8" width="32" height="34" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="416" y="518.8" width="32" height="34" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.2"/>
<rect x="448" y="518.8" width="448" height="34" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.2"/>
<rect x="896" y="518.8" width="256" height="34" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.2"/>
<rect x="128" y="578.8" width="32" height="34" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.2"/>
<rect x="160" y="578.8" width="32" height="34" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.2"/>
<rect x="192" y="578.8" width="448" height="34" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.2"/>
<rect x="640" y="578.8" width="256" height="34" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.2"/>
<rect x="896" y="578.8" width="256" height="34" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.2"/>
<rect x="32" y="638.8" width="1136" height="79.3" rx="10" fill="#0F2A28" stroke="#215A54" stroke-width="1"/>
<text x="32" y="152.8" font-size="15" font-weight="700" fill="#E8EDF3">16-bit frame</text>
<text x="182" y="152.8" font-size="13" fill="#9AA6B5">No CRC. Reads only: the driver sends writes as 24-bit frames.</text>
<text x="32" y="206.5" font-size="13" font-weight="700" fill="#D2DAE4">MOSI</text>
<text x="144" y="206.5" font-size="13" font-weight="600" text-anchor="middle" fill="#E2E8F0">0</text>
<text x="144" y="179.8" font-size="12" text-anchor="middle" fill="#9AA6B5">15</text>
<text x="176" y="206.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BBF7D0">R/W</text>
<text x="176" y="179.8" font-size="12" text-anchor="middle" fill="#9AA6B5">14</text>
<text x="416" y="206.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BFDBFE">address (in a write data frame: value)</text>
<text x="208" y="179.8" font-size="12" text-anchor="middle" fill="#9AA6B5">13</text>
<text x="624" y="179.8" font-size="12" text-anchor="middle" fill="#9AA6B5">0</text>
<text x="32" y="266.5" font-size="13" font-weight="700" fill="#D2DAE4">MISO</text>
<text x="144" y="266.5" font-size="13" font-weight="600" text-anchor="middle" fill="#FDE68A">W</text>
<text x="144" y="239.8" font-size="12" text-anchor="middle" fill="#9AA6B5">15</text>
<text x="176" y="266.5" font-size="13" font-weight="600" text-anchor="middle" fill="#FECDD3">E</text>
<text x="176" y="239.8" font-size="12" text-anchor="middle" fill="#9AA6B5">14</text>
<text x="416" y="266.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BFDBFE">data</text>
<text x="208" y="239.8" font-size="12" text-anchor="middle" fill="#9AA6B5">13</text>
<text x="624" y="239.8" font-size="12" text-anchor="middle" fill="#9AA6B5">0</text>
<text x="32" y="319.8" font-size="15" font-weight="700" fill="#E8EDF3">24-bit frame</text>
<text x="182" y="319.8" font-size="13" fill="#9AA6B5">The driver's default. The CRC protects the word in both directions.</text>
<text x="32" y="373.5" font-size="13" font-weight="700" fill="#D2DAE4">MOSI</text>
<text x="144" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#E2E8F0">0</text>
<text x="144" y="346.8" font-size="12" text-anchor="middle" fill="#9AA6B5">23</text>
<text x="176" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BBF7D0">R/W</text>
<text x="176" y="346.8" font-size="12" text-anchor="middle" fill="#9AA6B5">22</text>
<text x="416" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BFDBFE">address (in a write data frame: value)</text>
<text x="208" y="346.8" font-size="12" text-anchor="middle" fill="#9AA6B5">21</text>
<text x="624" y="346.8" font-size="12" text-anchor="middle" fill="#9AA6B5">8</text>
<text x="768" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC-8</text>
<text x="656" y="346.8" font-size="12" text-anchor="middle" fill="#9AA6B5">7</text>
<text x="880" y="346.8" font-size="12" text-anchor="middle" fill="#9AA6B5">0</text>
<text x="32" y="433.5" font-size="13" font-weight="700" fill="#D2DAE4">MISO</text>
<text x="144" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#FDE68A">W</text>
<text x="144" y="406.8" font-size="12" text-anchor="middle" fill="#9AA6B5">23</text>
<text x="176" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#FECDD3">E</text>
<text x="176" y="406.8" font-size="12" text-anchor="middle" fill="#9AA6B5">22</text>
<text x="416" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BFDBFE">data</text>
<text x="208" y="406.8" font-size="12" text-anchor="middle" fill="#9AA6B5">21</text>
<text x="624" y="406.8" font-size="12" text-anchor="middle" fill="#9AA6B5">8</text>
<text x="768" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC-8</text>
<text x="656" y="406.8" font-size="12" text-anchor="middle" fill="#9AA6B5">7</text>
<text x="880" y="406.8" font-size="12" text-anchor="middle" fill="#9AA6B5">0</text>
<text x="32" y="486.8" font-size="15" font-weight="700" fill="#E8EDF3">32-bit frame</text>
<text x="182" y="486.8" font-size="13" fill="#9AA6B5">For daisy chains. The pad byte is Config::pad_byte on MOSI; on MISO the driver ignores it.</text>
<text x="32" y="540.5" font-size="13" font-weight="700" fill="#D2DAE4">MOSI</text>
<text x="256" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#DDD6FE">pad byte</text>
<text x="144" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">31</text>
<text x="368" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">24</text>
<text x="400" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#E2E8F0">0</text>
<text x="400" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">23</text>
<text x="432" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BBF7D0">R/W</text>
<text x="432" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">22</text>
<text x="672" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BFDBFE">address (in a write data frame: value)</text>
<text x="464" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">21</text>
<text x="880" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">8</text>
<text x="1024" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC-8</text>
<text x="912" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">7</text>
<text x="1136" y="513.8" font-size="12" text-anchor="middle" fill="#9AA6B5">0</text>
<text x="32" y="600.5" font-size="13" font-weight="700" fill="#D2DAE4">MISO</text>
<text x="144" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#FDE68A">W</text>
<text x="144" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">31</text>
<text x="176" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#FECDD3">E</text>
<text x="176" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">30</text>
<text x="416" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#BFDBFE">data</text>
<text x="208" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">29</text>
<text x="624" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">16</text>
<text x="768" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC-8</text>
<text x="656" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">15</text>
<text x="880" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">8</text>
<text x="1024" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#DDD6FE">pad byte (ignored)</text>
<text x="912" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">7</text>
<text x="1136" y="573.8" font-size="12" text-anchor="middle" fill="#9AA6B5">0</text>
<text x="46" y="665.5" font-size="15" font-weight="700" fill="#A7F3E6">CRC</text>
<text x="46" y="683.3" font-size="13" fill="#A7F3E6">CRC-8 over the 16-bit word: polynomial 0x1D, initial value 0xC4, final XOR 0xFF. A MOSI frame with a wrong CRC is not executed and sets ERRFL; a MISO frame with a</text>
<text x="46" y="702.2" font-size="13" fill="#A7F3E6">wrong CRC fails the call with Error::Crc.</text>
<rect x="32" y="733.5" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="54" y="745.2" font-size="12.5" fill="#9AA6B5">R/W: 1 read, 0 write</text>
<rect x="200" y="733.5" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="222" y="745.2" font-size="12.5" fill="#9AA6B5">W: warning</text>
<rect x="316.9" y="733.5" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="338.9" y="745.2" font-size="12.5" fill="#9AA6B5">E: error</text>
<rect x="409" y="733.5" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="431" y="745.2" font-size="12.5" fill="#9AA6B5">address or data, 14 bits</text>
<rect x="601" y="733.5" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="623" y="745.2" font-size="12.5" fill="#9AA6B5">CRC-8 of the word</text>
<rect x="765" y="733.5" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="787" y="745.2" font-size="12.5" fill="#9AA6B5">pad byte</text>
<rect x="866" y="733.5" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="888" y="745.2" font-size="12.5" fill="#9AA6B5">always 0</text>
</svg>
