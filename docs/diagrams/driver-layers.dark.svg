<text x="48" y="331.4" font-size="17" font-weight="700" fill="#F8D27A">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#F8D27A">AS5047U, inc/as5047u.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="56" y="683.6" font-size="20" font-weight="700" fill="#F8D27A">Port contract</text>
<text x="56" y="714.2" font-size="17" fill="#D2DAE4">SpiInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="836.6" font-size="20" font-weight="700" fill="#A7F3E6">Your port</text>
<text x="56" y="865.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  Transfer()</text>
<text x="56" y="988.6" font-size="20" font-weight="700" fill="#E2E8F0">AS5047U</text>
<text x="56" y="1019.2" font-size="17" fill="#D2DAE4">the chip, on the SPI bus</text>
<rect x="322.9" y="604.6" width="214.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="622.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">register reads and writes</text>
<rect x="329.6" y="757.6" width="200.8" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="775.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">forwards to your hooks</text>
<rect x="371.8" y="909.6" width="116.4" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="927.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">SPI transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#F8D27A">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#F8D27A">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#F8D27A">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#F8D27A">and on the host.</text>
<text x="886" y="836.6" font-size="20" font-weight="700" fill="#A7F3E6">Yours</text>
<text x="886" y="860.1" font-size="17" fill="#A7F3E6">One small class per MCU or</text>
<text x="886" y="884.7" font-size="17" fill="#A7F3E6">board.</text>
<rect x="32" y="1055" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="1069.6" font-size="16" fill="#9AA6B5">you write</text>
