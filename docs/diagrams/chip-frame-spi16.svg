<text x="224" y="191.5" font-size="16" fill="#566070">MSB, sent first</text>
<text x="1140" y="191.5" font-size="16" text-anchor="end" fill="#566070">LSB, sent last</text>
<text x="32" y="230.5" font-size="20" font-weight="700" fill="#0E1726">Command</text>
<text x="32" y="250.5" font-size="16" fill="#566070">MOSI, read</text>
<text x="252.6" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#334155">x</text>
<text x="252.6" y="275.5" font-size="16" text-anchor="middle" fill="#566070">15</text>
<text x="309.9" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#8A3C0B">R</text>
<text x="309.9" y="275.5" font-size="16" text-anchor="middle" fill="#566070">14</text>
<text x="739.2" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#1E429F">ADDR[13:0]</text>
<text x="340.5" y="275.5" font-size="16" fill="#566070">13</text>
<text x="1138" y="275.5" font-size="16" text-anchor="end" fill="#566070">0</text>
<text x="32" y="318.5" font-size="20" font-weight="700" fill="#0E1726">Reply</text>
<text x="32" y="338.5" font-size="16" fill="#566070">MISO, next frame</text>
<text x="252.6" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#8A3C0B">W</text>
<text x="252.6" y="363.5" font-size="16" text-anchor="middle" fill="#566070">15</text>
<text x="309.9" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#9F1239">Error</text>
<text x="309.9" y="363.5" font-size="16" text-anchor="middle" fill="#566070">14</text>
<text x="739.2" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#14532D">DATA[13:0]</text>
<text x="340.5" y="363.5" font-size="16" fill="#566070">13</text>
<text x="1138" y="363.5" font-size="16" text-anchor="end" fill="#566070">0</text>
<text x="32" y="414.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CSn</text>
<text x="32" y="460.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CLK</text>
<text x="32" y="506.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">MOSI</text>
<text x="252.6" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">x</text>
<text x="309.9" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#8A3C0B">R</text>
<text x="739.2" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#1E429F">ADDR[13:0]</text>
<text x="32" y="552.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">MISO</text>
<text x="252.6" y="552.3" font-size="16" font-weight="600" text-anchor="middle" fill="#8A3C0B">W</text>
<text x="309.9" y="552.3" font-size="16" font-weight="600" text-anchor="middle" fill="#9F1239">E</text>
<text x="739.2" y="552.3" font-size="16" font-weight="600" text-anchor="middle" fill="#14532D">DATA[13:0]</text>
<text x="32" y="594.3" font-size="16" fill="#566070">SPI mode 1: CLK idles low; the chip samples its input on the falling edge and changes its output after the rising edge. CSn stays low for the</text>
<text x="32" y="617.5" font-size="16" fill="#566070">whole frame.</text>
