<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="chip-frame-spi16-title chip-frame-spi16-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-spi16-title">AS5047U: 16-bit SPI frame</title>
<desc id="chip-frame-spi16-desc">16-bit SPI frame of the AS5047U, 16 bits, most significant bit first. Command: don't care (bit 15), R (bit 14), ADDR[13:0] (bits 13 to 0); Reply: Warning (bit 15), Error (bit 14), DATA[13:0] (bits 13 to 0). Below, the SPI mode 1 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="663" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">AS5047U: 16-bit SPI frame</text>
<text x="32" y="115.4" font-size="18" fill="#566070">A read without CRC, for the highest rate; the reply to each command arrives in the next frame. 16 bits, sent most significant</text>
<text x="32" y="141.5" font-size="18" fill="#566070">bit first. Datasheet: SPI Transaction, Figures 20 to 22, p. 18.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
