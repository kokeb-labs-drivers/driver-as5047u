<text x="50" y="574.5" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="598" font-size="17" fill="#FECDD3">+3V3: VDD, VDD3V3; also U2.VDD · GND: GND, TEST; also U2.GND</text>
<text x="50" y="667.5" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="691" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor around the supplies (values in the full schematic). Not wired in this circuit (6): A, B, U, V, I/PWM,</text>
<text x="50" y="715.6" font-size="17" fill="#E2E8F0">W/PWM.</text>
