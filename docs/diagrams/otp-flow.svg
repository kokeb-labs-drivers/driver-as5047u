<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">OTP PROGRAMMING</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">ProgramOtp(), step by step</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Datasheet steps 6 to 19. The call stops at the first failure; OtpReport::failed_step names the step.</text>
