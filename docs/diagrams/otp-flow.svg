<text x="52" y="164.6" font-size="15" font-weight="700" fill="#334155">ProgramOtp(kOtpConfirm, report)</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">Not initialised: NotInitialized. Any confirm other than kOtpConfirm: InvalidArgument. Neither sends a frame.</text>
<text x="52" y="208.2" font-size="13" fill="#2B3442">Then every frame, reads included, carries a CRC until the call returns.</text>
<text x="68" y="355" font-size="15" font-weight="700" fill="#0B5F59">6. Read DISABLE to ECC</text>
<text x="68" y="379.8" font-size="13" fill="#2B3442">What will be burned</text>
<text x="68" y="457.9" font-size="15" font-weight="700" fill="#0B5F59">7. ECC = ECC_en</text>
<text x="68" y="482.8" font-size="13" fill="#2B3442">Read back</text>
<rect x="250.4" y="441.2" width="107.6" height="21.5" rx="10.8" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1"/>
<text x="258.4" y="455.6" font-size="11.5" font-weight="700" fill="#0B5F59">WriteMismatch</text>
<text x="68" y="561" font-size="15" font-weight="700" fill="#0B5F59">8. Read ECC_Checksum</text>
<text x="68" y="585.8" font-size="13" fill="#2B3442">The ECC key</text>
<text x="68" y="664" font-size="15" font-weight="700" fill="#0B5F59">9. ECC = ECC_en with</text>
<text x="68" y="683.5" font-size="15" font-weight="700" fill="#0B5F59">the key</text>
<text x="68" y="708.3" font-size="13" fill="#2B3442">Read back</text>
<rect x="250.4" y="647.2" width="107.6" height="21.5" rx="10.8" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1"/>
<text x="258.4" y="661.6" font-size="11.5" font-weight="700" fill="#0B5F59">WriteMismatch</text>
<text x="68" y="786" font-size="15" font-weight="700" fill="#0B5F59">10. Read DISABLE to ECC again</text>
<text x="68" y="864" font-size="15" font-weight="700" fill="#0B5F59">11. Compare with</text>
<text x="68" y="883.5" font-size="15" font-weight="700" fill="#0B5F59">what was read before</text>
<text x="68" y="908.3" font-size="13" fill="#2B3442">Must be equal</text>
<rect x="250.4" y="847.2" width="107.6" height="21.5" rx="10.8" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1"/>
<text x="258.4" y="861.6" font-size="11.5" font-weight="700" fill="#0B5F59">WriteMismatch</text>
<text x="460" y="355" font-size="15" font-weight="700" fill="#0B5F59">12. PROG = PROGEN</text>
<text x="460" y="379.8" font-size="13" fill="#2B3442">Enable OTP programming; read back</text>
<rect x="642.4" y="338.2" width="107.6" height="21.5" rx="10.8" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1"/>
<text x="650.4" y="352.6" font-size="11.5" font-weight="700" fill="#0B5F59">WriteMismatch</text>
<text x="460" y="497.9" font-size="15" font-weight="700" fill="#8A3C0B">13. PROG = PROGOTP</text>
<text x="460" y="522.8" font-size="13" fill="#2B3442">Start burning the OTP; sent once, not read</text>
<text x="460" y="541.7" font-size="13" fill="#2B3442">back</text>
<text x="460" y="620" font-size="15" font-weight="700" fill="#8A3C0B">14. Poll PROG until it reads</text>
<text x="460" y="639.5" font-size="15" font-weight="700" fill="#8A3C0B">PROGEN</text>
<text x="460" y="664.3" font-size="13" fill="#2B3442">Every 1 ms, at most 100 ms</text>
<rect x="684.6" y="603.2" width="65.4" height="21.5" rx="10.8" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<text x="692.6" y="617.6" font-size="11.5" font-weight="700" fill="#8A3C0B">Timeout</text>
<text x="852" y="355" font-size="15" font-weight="700" fill="#8A3C0B">15. Write 0 to</text>
<text x="852" y="374.5" font-size="15" font-weight="700" fill="#8A3C0B">DISABLE to ECC</text>
<text x="852" y="399.3" font-size="13" fill="#2B3442">Each write read back</text>
<rect x="1034.4" y="338.2" width="107.6" height="21.5" rx="10.8" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<text x="1042.4" y="352.6" font-size="11.5" font-weight="700" fill="#8A3C0B">WriteMismatch</text>
<text x="852" y="476.9" font-size="15" font-weight="700" fill="#8A3C0B">16. PROG = PROGVER</text>
<text x="852" y="501.8" font-size="13" fill="#2B3442">Guard-band verification; sent once, not</text>
<text x="852" y="520.7" font-size="13" fill="#2B3442">read back</text>
<text x="852" y="599" font-size="15" font-weight="700" fill="#8A3C0B">17. PROG = OTPREF</text>
<text x="852" y="623.8" font-size="13" fill="#2B3442">Reload the registers from the OTP; sent</text>
<text x="852" y="642.7" font-size="13" fill="#2B3442">once, not read back</text>
<text x="852" y="721" font-size="15" font-weight="700" fill="#8A3C0B">18. Read DISABLE to ECC again</text>
<text x="852" y="799" font-size="15" font-weight="700" fill="#8A3C0B">19. Compare with what</text>
<text x="852" y="818.5" font-size="15" font-weight="700" fill="#8A3C0B">was burned</text>
<text x="852" y="843.3" font-size="13" fill="#2B3442">Guard-band test</text>
<rect x="1067.6" y="782.2" width="74.4" height="21.5" rx="10.8" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<text x="1075.6" y="796.6" font-size="11.5" font-weight="700" fill="#8A3C0B">OtpVerify</text>
<text x="852" y="921" font-size="15" font-weight="700" fill="#14532D">Done: failed_step = 0</text>
<text x="852" y="945.8" font-size="13" fill="#2B3442">Then you: power cycle, read back,</text>
<text x="852" y="964.7" font-size="13" fill="#2B3442">compare (steps 20 to 22)</text>
<text x="48" y="290.8" font-size="13" font-weight="700" fill="#334155">PREPARE, STEPS 6 TO 11</text>
<text x="48" y="308.2" font-size="12" fill="#334155">Nothing is burned if a step fails here</text>
<text x="440" y="290.8" font-size="13" font-weight="700" fill="#334155">BURN, STEPS 12 TO 14</text>
<text x="440" y="308.2" font-size="12" fill="#334155">burn_started is true from step 13</text>
<text x="832" y="290.8" font-size="13" font-weight="700" fill="#334155">VERIFY, STEPS 15 TO 19</text>
<text x="832" y="308.2" font-size="12" fill="#334155">Failure after the burn: do not burn again</text>
<rect x="535.7" y="424.2" width="128.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="438.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">burn_started = true</text>
<rect x="250.4" y="441.2" width="107.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="258.4" y="455.6" font-size="11.5" font-weight="700" fill="#9F1239">WriteMismatch</text>
<rect x="250.4" y="647.2" width="107.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="258.4" y="661.6" font-size="11.5" font-weight="700" fill="#9F1239">WriteMismatch</text>
<rect x="250.4" y="847.2" width="107.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="258.4" y="861.6" font-size="11.5" font-weight="700" fill="#9F1239">WriteMismatch</text>
<rect x="642.4" y="338.2" width="107.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="650.4" y="352.6" font-size="11.5" font-weight="700" fill="#9F1239">WriteMismatch</text>
<rect x="684.6" y="603.2" width="65.4" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="692.6" y="617.6" font-size="11.5" font-weight="700" fill="#9F1239">Timeout</text>
<rect x="1034.4" y="338.2" width="107.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="1042.4" y="352.6" font-size="11.5" font-weight="700" fill="#9F1239">WriteMismatch</text>
<rect x="1067.6" y="782.2" width="74.4" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="1075.6" y="796.6" font-size="11.5" font-weight="700" fill="#9F1239">OtpVerify</text>
<text x="46" y="1051" font-size="15" font-weight="700" fill="#9F1239">Any step</text>
<text x="46" y="1068.8" font-size="13" fill="#9F1239">Every step also stops on a transfer or reply error: Bus, Crc, Framing, Command or DeviceFault.</text>
<rect x="32" y="1100.1" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="1111.7" font-size="12.5" fill="#566070">fails here: nothing burned</text>
<rect x="238.7" y="1100.1" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="260.7" y="1111.7" font-size="12.5" fill="#566070">fails here: fuses may be blown</text>
<rect x="475.9" y="1100.1" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="497.9" y="1111.7" font-size="12.5" fill="#566070">error this step adds</text>
<path d="M643.9 1106.3L673.9 1106.3" fill="none" stroke="#8893A2" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="687.9" y="1111.7" font-size="12.5" fill="#566070">next step</text>
</svg>
