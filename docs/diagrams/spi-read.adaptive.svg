<path d="M108.9 180.8 L408.1 180.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-read-arrow-rail)" class="fk-s-rail"/>
<path d="M408.1 224.8 L108.9 224.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-read-arrow-rail)" class="fk-s-rail"/>
<path d="M108.9 268.8 L408.1 268.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-read-arrow-rail)" class="fk-s-rail"/>
<path d="M408.1 312.8 L108.9 312.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-read-arrow-rail)" class="fk-s-rail"/>
<rect x="39.9" y="88.8" width="130" height="52" rx="10" stroke-width="1.4" class="fk-f-green-tint fk-s-green-strong"/>
<rect x="39.9" y="96.8" width="4" height="36" rx="2" class="fk-f-green-strong"/>
<rect x="347.1" y="88.8" width="130" height="52" rx="10" stroke-width="1.4" class="fk-f-amber-tint fk-s-amber-strong"/>
<rect x="347.1" y="96.8" width="4" height="36" rx="2" class="fk-f-amber-strong"/>
<rect x="34.9" y="340.8" width="447.3" height="41" rx="10" stroke-width="1" class="fk-f-amber-tint fk-s-amber-soft"/>
<text x="107.9" y="119.3" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-green-text">Driver</text>
<text x="415.1" y="119.3" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-amber-text">AS5047U</text>
<rect x="170.9" y="156.8" width="175.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="258.5" y="171.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">read ANGLECOM (0x3FFF)</text>
<rect x="133.6" y="200.8" width="249.9" height="20" rx="10" class="fk-f-canvas"/>
<text x="258.5" y="215.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">reply to the previous frame (discarded)</text>
<rect x="192.8" y="244.8" width="131.4" height="20" rx="10" class="fk-f-canvas"/>
<text x="258.5" y="259.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">read NOP (0x4000)</text>
<rect x="112.9" y="288.8" width="291.3" height="20" rx="10" class="fk-f-canvas"/>
<text x="258.5" y="303.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">ANGLECOM data, warning and error bits, CRC</text>
<text x="48.9" y="365.9" font-size="13" class="fk-f-amber-text">error bit set? read ERRFL and fail the call</text>
</svg>
