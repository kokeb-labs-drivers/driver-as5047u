<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="779" viewBox="0 0 1200 779" role="img" aria-labelledby="spi-frames-title spi-frames-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="spi-frames-title">SPI frames, bit by bit</title>
<desc id="spi-frames-desc">Bit layouts of the 16-, 24- and 32-bit SPI frames: on MOSI the R/W bit and a 14-bit address, on MISO a warning bit, an error bit and 14 data bits; 24-bit frames add a CRC-8 byte, and 32-bit frames add a pad byte, first on MOSI and last on MISO.</desc>
<rect x="0.5" y="0.5" width="1199" height="778" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">SPI frames, bit by bit</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Bits in the order they are clocked, most significant first. Numbers are bit positions in the frame.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
<rect x="128" y="184.8" width="32" height="34" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
<rect x="160" y="184.8" width="32" height="34" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.2"/>
<rect x="192" y="184.8" width="448" height="34" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2"/>
<rect x="128" y="244.8" width="32" height="34" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.2"/>
<rect x="160" y="244.8" width="32" height="34" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.2"/>
<rect x="192" y="244.8" width="448" height="34" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2"/>
<rect x="128" y="351.8" width="32" height="34" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
<rect x="160" y="351.8" width="32" height="34" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.2"/>
<rect x="192" y="351.8" width="448" height="34" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2"/>
<rect x="640" y="351.8" width="256" height="34" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.2"/>
<rect x="128" y="411.8" width="32" height="34" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.2"/>
<rect x="160" y="411.8" width="32" height="34" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.2"/>
<rect x="192" y="411.8" width="448" height="34" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2"/>
<rect x="640" y="411.8" width="256" height="34" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.2"/>
<rect x="128" y="518.8" width="256" height="34" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/>
<rect x="384" y="518.8" width="32" height="34" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
<rect x="416" y="518.8" width="32" height="34" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.2"/>
<rect x="448" y="518.8" width="448" height="34" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2"/>
<rect x="896" y="518.8" width="256" height="34" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.2"/>
<rect x="128" y="578.8" width="32" height="34" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.2"/>
<rect x="160" y="578.8" width="32" height="34" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.2"/>
<rect x="192" y="578.8" width="448" height="34" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2"/>
<rect x="640" y="578.8" width="256" height="34" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.2"/>
<rect x="896" y="578.8" width="256" height="34" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/>
<rect x="32" y="638.8" width="1136" height="79.3" rx="10" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1"/>
<text x="32" y="152.8" font-size="15" font-weight="700" fill="#0E1726">16-bit frame</text>
<text x="182" y="152.8" font-size="13" fill="#566070">No CRC. Reads only: the driver sends writes as 24-bit frames.</text>
<text x="32" y="206.5" font-size="13" font-weight="700" fill="#2B3442">MOSI</text>
<text x="144" y="206.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">0</text>
<text x="144" y="179.8" font-size="12" text-anchor="middle" fill="#566070">15</text>
<text x="176" y="206.5" font-size="13" font-weight="600" text-anchor="middle" fill="#14532D">R/W</text>
<text x="176" y="179.8" font-size="12" text-anchor="middle" fill="#566070">14</text>
<text x="416" y="206.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1E429F">address (in a write data frame: value)</text>
<text x="208" y="179.8" font-size="12" text-anchor="middle" fill="#566070">13</text>
<text x="624" y="179.8" font-size="12" text-anchor="middle" fill="#566070">0</text>
<text x="32" y="266.5" font-size="13" font-weight="700" fill="#2B3442">MISO</text>
<text x="144" y="266.5" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3C0B">W</text>
<text x="144" y="239.8" font-size="12" text-anchor="middle" fill="#566070">15</text>
<text x="176" y="266.5" font-size="13" font-weight="600" text-anchor="middle" fill="#9F1239">E</text>
<text x="176" y="239.8" font-size="12" text-anchor="middle" fill="#566070">14</text>
<text x="416" y="266.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1E429F">data</text>
<text x="208" y="239.8" font-size="12" text-anchor="middle" fill="#566070">13</text>
<text x="624" y="239.8" font-size="12" text-anchor="middle" fill="#566070">0</text>
<text x="32" y="319.8" font-size="15" font-weight="700" fill="#0E1726">24-bit frame</text>
<text x="182" y="319.8" font-size="13" fill="#566070">The driver's default. The CRC protects the word in both directions.</text>
<text x="32" y="373.5" font-size="13" font-weight="700" fill="#2B3442">MOSI</text>
<text x="144" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">0</text>
<text x="144" y="346.8" font-size="12" text-anchor="middle" fill="#566070">23</text>
<text x="176" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#14532D">R/W</text>
<text x="176" y="346.8" font-size="12" text-anchor="middle" fill="#566070">22</text>
<text x="416" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1E429F">address (in a write data frame: value)</text>
<text x="208" y="346.8" font-size="12" text-anchor="middle" fill="#566070">21</text>
<text x="624" y="346.8" font-size="12" text-anchor="middle" fill="#566070">8</text>
<text x="768" y="373.5" font-size="13" font-weight="600" text-anchor="middle" fill="#0B5F59">CRC-8</text>
<text x="656" y="346.8" font-size="12" text-anchor="middle" fill="#566070">7</text>
<text x="880" y="346.8" font-size="12" text-anchor="middle" fill="#566070">0</text>
<text x="32" y="433.5" font-size="13" font-weight="700" fill="#2B3442">MISO</text>
<text x="144" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3C0B">W</text>
<text x="144" y="406.8" font-size="12" text-anchor="middle" fill="#566070">23</text>
<text x="176" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#9F1239">E</text>
<text x="176" y="406.8" font-size="12" text-anchor="middle" fill="#566070">22</text>
<text x="416" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1E429F">data</text>
<text x="208" y="406.8" font-size="12" text-anchor="middle" fill="#566070">21</text>
<text x="624" y="406.8" font-size="12" text-anchor="middle" fill="#566070">8</text>
<text x="768" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="#0B5F59">CRC-8</text>
<text x="656" y="406.8" font-size="12" text-anchor="middle" fill="#566070">7</text>
<text x="880" y="406.8" font-size="12" text-anchor="middle" fill="#566070">0</text>
<text x="32" y="486.8" font-size="15" font-weight="700" fill="#0E1726">32-bit frame</text>
<text x="182" y="486.8" font-size="13" fill="#566070">For daisy chains. The pad byte is Config::pad_byte on MOSI; on MISO the driver ignores it.</text>
<text x="32" y="540.5" font-size="13" font-weight="700" fill="#2B3442">MOSI</text>
<text x="256" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#5B21B6">pad byte</text>
<text x="144" y="513.8" font-size="12" text-anchor="middle" fill="#566070">31</text>
<text x="368" y="513.8" font-size="12" text-anchor="middle" fill="#566070">24</text>
<text x="400" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">0</text>
<text x="400" y="513.8" font-size="12" text-anchor="middle" fill="#566070">23</text>
<text x="432" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#14532D">R/W</text>
<text x="432" y="513.8" font-size="12" text-anchor="middle" fill="#566070">22</text>
<text x="672" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1E429F">address (in a write data frame: value)</text>
<text x="464" y="513.8" font-size="12" text-anchor="middle" fill="#566070">21</text>
<text x="880" y="513.8" font-size="12" text-anchor="middle" fill="#566070">8</text>
<text x="1024" y="540.5" font-size="13" font-weight="600" text-anchor="middle" fill="#0B5F59">CRC-8</text>
<text x="912" y="513.8" font-size="12" text-anchor="middle" fill="#566070">7</text>
<text x="1136" y="513.8" font-size="12" text-anchor="middle" fill="#566070">0</text>
<text x="32" y="600.5" font-size="13" font-weight="700" fill="#2B3442">MISO</text>
<text x="144" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3C0B">W</text>
<text x="144" y="573.8" font-size="12" text-anchor="middle" fill="#566070">31</text>
<text x="176" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#9F1239">E</text>
<text x="176" y="573.8" font-size="12" text-anchor="middle" fill="#566070">30</text>
<text x="416" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1E429F">data</text>
<text x="208" y="573.8" font-size="12" text-anchor="middle" fill="#566070">29</text>
<text x="624" y="573.8" font-size="12" text-anchor="middle" fill="#566070">16</text>
<text x="768" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#0B5F59">CRC-8</text>
<text x="656" y="573.8" font-size="12" text-anchor="middle" fill="#566070">15</text>
<text x="880" y="573.8" font-size="12" text-anchor="middle" fill="#566070">8</text>
<text x="1024" y="600.5" font-size="13" font-weight="600" text-anchor="middle" fill="#5B21B6">pad byte (ignored)</text>
<text x="912" y="573.8" font-size="12" text-anchor="middle" fill="#566070">7</text>
<text x="1136" y="573.8" font-size="12" text-anchor="middle" fill="#566070">0</text>
<text x="46" y="665.5" font-size="15" font-weight="700" fill="#0B5F59">CRC</text>
<text x="46" y="683.3" font-size="13" fill="#0B5F59">CRC-8 over the 16-bit word: polynomial 0x1D, initial value 0xC4, final XOR 0xFF. A MOSI frame with a wrong CRC is not executed and sets ERRFL; a MISO frame with a</text>
<text x="46" y="702.2" font-size="13" fill="#0B5F59">wrong CRC fails the call with Error::Crc.</text>
<rect x="32" y="733.5" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="54" y="745.2" font-size="12.5" fill="#566070">R/W: 1 read, 0 write</text>
<rect x="200" y="733.5" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="222" y="745.2" font-size="12.5" fill="#566070">W: warning</text>
<rect x="316.9" y="733.5" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="338.9" y="745.2" font-size="12.5" fill="#566070">E: error</text>
<rect x="409" y="733.5" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="431" y="745.2" font-size="12.5" fill="#566070">address or data, 14 bits</text>
<rect x="601" y="733.5" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="623" y="745.2" font-size="12.5" fill="#566070">CRC-8 of the word</text>
<rect x="765" y="733.5" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="787" y="745.2" font-size="12.5" fill="#566070">pad byte</text>
<rect x="866" y="733.5" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="888" y="745.2" font-size="12.5" fill="#566070">always 0</text>
</svg>
