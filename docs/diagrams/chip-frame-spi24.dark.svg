<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="chip-frame-spi24-title chip-frame-spi24-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-spi24-title">AS5047U: 24-bit SPI frame with CRC</title>
<desc id="chip-frame-spi24-desc">24-bit SPI frame with CRC of the AS5047U, 24 bits, most significant bit first. Command: don't care (bit 23), RW (bit 22), ADDR[13:0] (bits 21 to 8), CRC-8 (bits 7 to 0); Reply: Warning (bit 23), Error (bit 22), DATA[13:0] (bits 21 to 8), CRC-8 (bits 7 to 0). Below, the SPI mode 1 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="663" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">AS5047U: 24-bit SPI frame with CRC</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">The driver's default; a CRC-8 over bits 23 to 8 protects both directions, and a write command is followed by a data frame</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">with the new register content. 24 bits, sent most significant bit first. Datasheet: SPI Transaction, Figures 23 to 25, p. 19.</text>
