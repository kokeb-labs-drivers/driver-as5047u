<text x="32" y="594.3" font-size="16" fill="#9AA6B5">SPI mode 1: CLK idles low; the chip samples its input on the falling edge and changes its output after the rising edge. CSn stays low for the</text>
<text x="32" y="617.5" font-size="16" fill="#9AA6B5">whole frame.</text>
