<text x="50" y="574.5" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="598" font-size="17" fill="#9F1239">+5V: VDD; also U2.VDD · VDD3V3: VDD3V3 · GND: GND, TEST; also U2.GND</text>
<text x="50" y="667.5" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="691" font-size="17" fill="#334155">Support parts: 2 capacitors around the supplies (values in the full schematic). Not wired in this circuit (6): A, B, U, V, I/PWM,</text>
<text x="50" y="715.6" font-size="17" fill="#334155">W/PWM.</text>
