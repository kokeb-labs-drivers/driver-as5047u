<text x="160" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">AS5047U</text>
<text x="236.6" y="162.8" font-size="12" fill="#E2E8F0">TSSOP-14</text>
<text x="204" y="228.6" font-size="15" font-weight="700" fill="#E2E8F0">LDO</text>
<text x="204" y="253.4" font-size="13" fill="#D2DAE4">3.3 V core from 5 V</text>
<text x="516" y="228.6" font-size="15" font-weight="700" fill="#FDE68A">Registers and OTP</text>
<text x="516" y="253.4" font-size="13" fill="#D2DAE4">volatile and one-time</text>
<text x="516" y="272.2" font-size="13" fill="#D2DAE4">settings</text>
<text x="828" y="228.6" font-size="15" font-weight="700" fill="#BFDBFE">SPI and CRC</text>
<text x="828" y="253.4" font-size="13" fill="#D2DAE4">mode 1, 16-, 24- or 32-bit</text>
<text x="828" y="272.2" font-size="13" fill="#D2DAE4">frames</text>
<text x="204" y="380.6" font-size="15" font-weight="700" fill="#A7F3E6">Hall sensors and AFE</text>
<text x="204" y="405.4" font-size="13" fill="#D2DAE4">4 Hall sensors, 14-bit</text>
<text x="204" y="424.3" font-size="13" fill="#D2DAE4">ADCs, AGC</text>
<text x="516" y="380.6" font-size="15" font-weight="700" fill="#A7F3E6">CORDIC</text>
<text x="516" y="405.4" font-size="13" fill="#D2DAE4">angle and magnitude</text>
<text x="828" y="380.6" font-size="15" font-weight="700" fill="#A7F3E6">DAEC and adaptive</text>
<text x="828" y="400.1" font-size="15" font-weight="700" fill="#A7F3E6">filter</text>
<text x="828" y="424.9" font-size="13" fill="#D2DAE4">latency compensation,</text>
<text x="828" y="443.8" font-size="13" fill="#D2DAE4">noise filter</text>
<text x="516" y="540.5" font-size="15" font-weight="700" fill="#DDD6FE">PWM</text>
<text x="516" y="565.4" font-size="13" fill="#D2DAE4">12-bit angle as a duty</text>
<text x="516" y="584.2" font-size="13" fill="#D2DAE4">cycle</text>
<text x="828" y="540.5" font-size="15" font-weight="700" fill="#DDD6FE">ABI</text>
<text x="828" y="565.4" font-size="13" fill="#D2DAE4">quadrature and index</text>
<text x="828" y="676.5" font-size="15" font-weight="700" fill="#DDD6FE">UVW</text>
<text x="828" y="701.4" font-size="13" fill="#D2DAE4">Hall emulation, 1 to 7 pole</text>
<text x="828" y="720.2" font-size="13" fill="#D2DAE4">pairs</text>
<text x="130" y="230.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">VDD  11</text>
<text x="130" y="254.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">VDD3V3  12</text>
<text x="130" y="278.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">GND  13</text>
<text x="1078" y="222.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">CSn  1</text>
<text x="1078" y="246.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">CLK  2</text>
