<text x="160" y="162.8" font-size="13" font-weight="700" fill="#334155">AS5047U</text>
<text x="236.6" y="162.8" font-size="12" fill="#334155">TSSOP-14</text>
<text x="204" y="228.6" font-size="15" font-weight="700" fill="#334155">LDO</text>
<text x="204" y="253.4" font-size="13" fill="#2B3442">3.3 V core from 5 V</text>
<text x="516" y="228.6" font-size="15" font-weight="700" fill="#8A3C0B">Registers and OTP</text>
<text x="516" y="253.4" font-size="13" fill="#2B3442">volatile and one-time</text>
<text x="516" y="272.2" font-size="13" fill="#2B3442">settings</text>
<text x="828" y="228.6" font-size="15" font-weight="700" fill="#1E429F">SPI and CRC</text>
<text x="828" y="253.4" font-size="13" fill="#2B3442">mode 1, 16-, 24- or 32-bit</text>
<text x="828" y="272.2" font-size="13" fill="#2B3442">frames</text>
<text x="204" y="380.6" font-size="15" font-weight="700" fill="#0B5F59">Hall sensors and AFE</text>
<text x="204" y="405.4" font-size="13" fill="#2B3442">4 Hall sensors, 14-bit</text>
<text x="204" y="424.3" font-size="13" fill="#2B3442">ADCs, AGC</text>
<text x="516" y="380.6" font-size="15" font-weight="700" fill="#0B5F59">CORDIC</text>
<text x="516" y="405.4" font-size="13" fill="#2B3442">angle and magnitude</text>
<text x="828" y="380.6" font-size="15" font-weight="700" fill="#0B5F59">DAEC and adaptive</text>
<text x="828" y="400.1" font-size="15" font-weight="700" fill="#0B5F59">filter</text>
<text x="828" y="424.9" font-size="13" fill="#2B3442">latency compensation,</text>
<text x="828" y="443.8" font-size="13" fill="#2B3442">noise filter</text>
<text x="516" y="540.5" font-size="15" font-weight="700" fill="#5B21B6">PWM</text>
<text x="516" y="565.4" font-size="13" fill="#2B3442">12-bit angle as a duty</text>
<text x="516" y="584.2" font-size="13" fill="#2B3442">cycle</text>
<text x="828" y="540.5" font-size="15" font-weight="700" fill="#5B21B6">ABI</text>
<text x="828" y="565.4" font-size="13" fill="#2B3442">quadrature and index</text>
<text x="828" y="676.5" font-size="15" font-weight="700" fill="#5B21B6">UVW</text>
<text x="828" y="701.4" font-size="13" fill="#2B3442">Hall emulation, 1 to 7 pole</text>
<text x="828" y="720.2" font-size="13" fill="#2B3442">pairs</text>
<text x="130" y="230.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">VDD  11</text>
<text x="130" y="254.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">VDD3V3  12</text>
<text x="130" y="278.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">GND  13</text>
<text x="1078" y="222.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CSn  1</text>
<text x="1078" y="246.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CLK  2</text>
<text x="1078" y="270.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">MISO  3</text>
<text x="1078" y="294.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">MOSI  4</text>
<text x="1078" y="534.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">A  7</text>
<text x="1078" y="558.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">B  6</text>
<text x="1078" y="582.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">I/PWM  14</text>
<text x="1078" y="670.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">U  10</text>
<text x="1078" y="694.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">V  9</text>
<text x="1078" y="718.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">W/PWM  8</text>
