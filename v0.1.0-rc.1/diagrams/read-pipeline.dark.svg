<rect x="32" y="952.8" width="1136" height="79.3" rx="10" fill="#2C2310" stroke="#6A5220" stroke-width="1"/>
<text x="239" y="152.8" font-size="15" font-weight="700" text-anchor="middle" fill="#D2DAE4">Frame 1</text>
<text x="503" y="152.8" font-size="15" font-weight="700" text-anchor="middle" fill="#D2DAE4">Frame 2</text>
<text x="767" y="152.8" font-size="15" font-weight="700" text-anchor="middle" fill="#D2DAE4">Frame 3</text>
<text x="1031" y="152.8" font-size="15" font-weight="700" text-anchor="middle" fill="#D2DAE4">Frame 4</text>
<text x="48" y="195.8" font-size="13" font-weight="700" fill="#E2E8F0">READ</text>
<text x="97.7" y="195.8" font-size="12" fill="#E2E8F0">ReadRegister(ANGLECOM), and every other read</text>
<text x="48" y="288.5" font-size="13" font-weight="700" fill="#E2E8F0">MOSI</text>
<text x="48" y="460.5" font-size="13" font-weight="700" fill="#E2E8F0">MISO</text>
<text x="144" y="246.6" font-size="15" font-weight="700" fill="#BFDBFE">Read ANGLECOM</text>
<text x="144" y="271.4" font-size="13" fill="#D2DAE4">0x7FFF: R/W 1, address</text>
<text x="144" y="290.2" font-size="13" fill="#D2DAE4">0x3FFF</text>
<text x="144" y="418.6" font-size="15" font-weight="700" fill="#E8EDF3">Reply to the frame</text>
<text x="144" y="438.1" font-size="15" font-weight="700" fill="#E8EDF3">before</text>
<text x="144" y="462.9" font-size="13" fill="#D2DAE4">Not used; only a failed</text>
<text x="144" y="481.8" font-size="13" fill="#D2DAE4">transfer fails the call</text>
<text x="408" y="246.6" font-size="15" font-weight="700" fill="#BFDBFE">NOP read</text>
<text x="408" y="271.4" font-size="13" fill="#D2DAE4">0x4000: R/W 1, address 0</text>
<text x="408" y="290.2" font-size="13" fill="#D2DAE4">Asks for nothing new</text>
<text x="408" y="418.6" font-size="15" font-weight="700" fill="#BBF7D0">ANGLECOM data</text>
<text x="408" y="443.4" font-size="13" fill="#D2DAE4">The value of the call.</text>
<text x="408" y="462.3" font-size="13" fill="#D2DAE4">Checked: CRC, then the error</text>
<text x="408" y="481.1" font-size="13" fill="#D2DAE4">bit</text>
<text x="672" y="246.6" font-size="15" font-weight="700" fill="#E8EDF3">Only if the error bit is set:</text>
<text x="672" y="266.1" font-size="15" font-weight="700" fill="#E8EDF3">read ERRFL</text>
<text x="672" y="290.9" font-size="13" fill="#D2DAE4">0x4001</text>
<text x="672" y="418.6" font-size="15" font-weight="700" fill="#E8EDF3">Reply to the NOP read</text>
<text x="672" y="443.4" font-size="13" fill="#D2DAE4">Not used</text>
<text x="936" y="246.6" font-size="15" font-weight="700" fill="#E8EDF3">NOP read</text>
<text x="936" y="271.4" font-size="13" fill="#D2DAE4">0x4000</text>
<text x="936" y="418.6" font-size="15" font-weight="700" fill="#BBF7D0">ERRFL, cleared by the</text>
<text x="936" y="438.1" font-size="15" font-weight="700" fill="#BBF7D0">read</text>
<text x="936" y="462.9" font-size="13" fill="#D2DAE4">Fails the call with Crc,</text>
<text x="936" y="481.8" font-size="13" fill="#D2DAE4">Framing, Command or</text>
<text x="936" y="500.6" font-size="13" fill="#D2DAE4">DeviceFault</text>
<text x="48" y="590.8" font-size="13" font-weight="700" fill="#E2E8F0">WRITE</text>
<text x="104.8" y="590.8" font-size="12" fill="#E2E8F0">WriteRegister(address, value) and every settings write</text>
<text x="48" y="683.5" font-size="13" font-weight="700" fill="#E2E8F0">MOSI</text>
<text x="48" y="855.5" font-size="13" font-weight="700" fill="#E2E8F0">MISO</text>
<text x="144" y="641.5" font-size="15" font-weight="700" fill="#BFDBFE">Write command</text>
<text x="144" y="666.4" font-size="13" fill="#D2DAE4">R/W 0, the address; always</text>
<text x="144" y="685.2" font-size="13" fill="#D2DAE4">with a CRC</text>
<text x="144" y="813.5" font-size="15" font-weight="700" fill="#E8EDF3">Reply to the frame</text>
<text x="144" y="833" font-size="15" font-weight="700" fill="#E8EDF3">before</text>
<text x="144" y="857.9" font-size="13" fill="#D2DAE4">Not used; only a failed</text>
<text x="144" y="876.8" font-size="13" fill="#D2DAE4">transfer fails the call</text>
<text x="408" y="641.5" font-size="15" font-weight="700" fill="#BFDBFE">Data</text>
<text x="408" y="666.4" font-size="13" fill="#D2DAE4">The 14-bit value, R/W 0;</text>
<text x="408" y="685.2" font-size="13" fill="#D2DAE4">always with a CRC</text>
<text x="408" y="813.5" font-size="15" font-weight="700" fill="#BBF7D0">Reports on the command</text>
<text x="408" y="833" font-size="15" font-weight="700" fill="#BBF7D0">frame</text>
<text x="408" y="857.9" font-size="13" fill="#D2DAE4">Error bit set: read ERRFL and</text>
<text x="408" y="876.8" font-size="13" fill="#D2DAE4">fail</text>
<text x="672" y="641.5" font-size="15" font-weight="700" fill="#E8EDF3">Read command, same</text>
<text x="672" y="661" font-size="15" font-weight="700" fill="#E8EDF3">address</text>
<text x="672" y="685.9" font-size="13" fill="#D2DAE4">Only with Verify::ReadBack,</text>
<text x="672" y="704.8" font-size="13" fill="#D2DAE4">at start-up and in</text>
<text x="672" y="723.6" font-size="13" fill="#D2DAE4">ProgramOtp()</text>
<text x="672" y="813.5" font-size="15" font-weight="700" fill="#E8EDF3">Reply to the data frame</text>
<text x="672" y="838.4" font-size="13" fill="#D2DAE4">Not used; only a failed</text>
<text x="672" y="857.2" font-size="13" fill="#D2DAE4">transfer fails the call</text>
<text x="936" y="641.5" font-size="15" font-weight="700" fill="#E8EDF3">NOP read</text>
<text x="936" y="666.4" font-size="13" fill="#D2DAE4">0x4000</text>
<text x="936" y="813.5" font-size="15" font-weight="700" fill="#BBF7D0">The register</text>
<text x="936" y="838.4" font-size="13" fill="#D2DAE4">Must equal the value written,</text>
<text x="936" y="857.2" font-size="13" fill="#D2DAE4">else WriteMismatch</text>
<text x="46" y="979.5" font-size="15" font-weight="700" fill="#FDE68A">After a failed transfer</text>
<text x="46" y="997.3" font-size="13" fill="#FDE68A">After any failed transfer the chip may still wait for a write's data frame, so the next frame the driver sends is a NOP read (0x4000): as a command it reads nothing, as data</text>
<text x="46" y="1016.2" font-size="13" fill="#FDE68A">it writes 0. Without it a lost PROG data frame let the next read burn the OTP.</text>
<rect x="32" y="1047.5" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="54" y="1059.2" font-size="12.5" fill="#9AA6B5">driver sends (MOSI)</text>
<rect x="203.4" y="1047.5" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="225.4" y="1059.2" font-size="12.5" fill="#9AA6B5">the reply the call uses</text>
<rect x="386.5" y="1047.5" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="408.5" y="1059.2" font-size="12.5" fill="#9AA6B5">reply that belongs to the frame before</text>
<path d="M670.5 1053.8L700.5 1053.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#fk-arrow-rail)"/>
<text x="714.5" y="1059.2" font-size="12.5" fill="#9AA6B5">answered in the next frame</text>
</svg>
