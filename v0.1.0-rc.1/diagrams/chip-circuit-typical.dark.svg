<svg xmlns="http://www.w3.org/2000/svg" width="792" height="687" viewBox="0 0 792 687" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">AS5047U: Minimum circuit, 5 V</title>
<desc id="chip-circuit-typical-desc">Schematic of the AS5047U minimum circuit, 5 v: the chip with U2 MCU, C1 capacitor 100 nF, C2 capacitor 1 µF; the MCU wires carry the port hooks Transfer().</desc>
<rect x="0.5" y="0.5" width="791" height="686" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">AS5047U: Minimum circuit, 5 V</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Figure 61: the sensor on the MCU's SPI bus, VDD at 5 V with 100 nF to GND, the LDO output</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">VDD3V3 with its 1 µF, TEST to ground and the incremental outputs open. In 5 V operation the</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">logic levels follow VDD. Above each MCU wire: the port hook that drives it. Datasheet: Circuit</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">Diagram, Figure 61, p. 44.</text>
